# Single-client CefasDB stack for a local client-server app:
# Electron -> Node API -> CefasDB.
#
# Start only the database:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Build the local source image instead of using the published tag:
#   docker compose -f deploy/docker-compose.yml up --build -d
#
# CefasDB is available from the host at:
#   - HTTP / SQL: http://127.0.0.1:${CEFASDB_HTTP_PORT:-8080}
#   - gRPC:      127.0.0.1:${CEFASDB_GRPC_PORT:-9090}
#
# A Node service in the same compose project should use:
#   cefasdb:9090
#
# Observability is optional:
#   docker compose -f deploy/docker-compose.yml --profile observability up -d

services:
  cefasdb:
    image: ghcr.io/cefasdb/cefasdb:${CEFAS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${CEFAS_IMAGE_TAG:-dev}
    command:
      - "-config"
      - "/etc/cefasdb/cefasdb.yml"
    environment:
      GOMAXPROCS: ${CEFASDB_GOMAXPROCS:-4}
      GOMEMLIMIT: ${CEFASDB_GOMEMLIMIT:-3GiB}
    ports:
      - "127.0.0.1:${CEFASDB_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${CEFASDB_GRPC_PORT:-9090}:9090"
    volumes:
      - cefasdb-data:/var/lib/cefas
      - ${CEFASDB_CONFIG_FILE:-./cefasdb.single-client.yml}:/etc/cefasdb/cefasdb.yml:ro
    networks:
      cefasdb-local:
        aliases:
          - cefas
    cpus: ${CEFASDB_CPUS:-4.0}
    mem_limit: ${CEFASDB_MEMORY_LIMIT:-4g}
    restart: unless-stopped
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "/usr/local/bin/cefasdb", "-help"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - observability
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cefasdb
    networks:
      - cefasdb-local

  grafana:
    image: grafana/grafana:latest
    profiles:
      - observability
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cefasdb-local

networks:
  cefasdb-local:

volumes:
  cefasdb-data:
