apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cefas.fullname" . }}-config
  labels:
    {{- include "cefas.labels" . | nindent 4 }}
data:
  cefas.yaml: |
    data: /var/lib/cefas
    http:
      addr: ":{{ .Values.service.http }}"
    lifecycle:
      shutdownGracePeriod: {{ .Values.lifecycle.shutdownGracePeriod | quote }}
      drainDelay: {{ .Values.lifecycle.drainDelay | quote }}
      leadershipTransferTimeout: {{ .Values.lifecycle.leadershipTransferTimeout | quote }}
    grpc:
      addr: ":{{ .Values.service.grpc }}"
      reflection: true
    storage:
      fsyncOnCommit: {{ .Values.cluster.fsyncOnCommit }}
      {{- with .Values.storage.profile }}
      profile: {{ . | quote }}
      {{- end }}
      {{- with .Values.storage.raftProfile }}
      raftProfile: {{ . | quote }}
      {{- end }}
      {{- with .Values.storage.blockCacheSizeBytes }}
      blockCacheSizeBytes: {{ . }}
      {{- end }}
      {{- with .Values.storage.memTableSizeBytes }}
      memTableSizeBytes: {{ . }}
      {{- end }}
      {{- with .Values.storage.memTableStopWritesThreshold }}
      memTableStopWritesThreshold: {{ . }}
      {{- end }}
      {{- with .Values.storage.maxConcurrentCompactions }}
      maxConcurrentCompactions: {{ . }}
      {{- end }}
      {{- with .Values.storage.l0CompactionConcurrency }}
      l0CompactionConcurrency: {{ . }}
      {{- end }}
      {{- with .Values.storage.l0CompactionThreshold }}
      l0CompactionThreshold: {{ . }}
      {{- end }}
      {{- with .Values.storage.l0CompactionFileThreshold }}
      l0CompactionFileThreshold: {{ . }}
      {{- end }}
      {{- with .Values.storage.l0StopWritesThreshold }}
      l0StopWritesThreshold: {{ . }}
      {{- end }}
      {{- with .Values.storage.bytesPerSync }}
      bytesPerSync: {{ . }}
      {{- end }}
      {{- with .Values.storage.walBytesPerSync }}
      walBytesPerSync: {{ . }}
      {{- end }}
      {{- with .Values.storage.lanes }}
      lanes: {{ . | quote }}
      {{- end }}
      {{- with .Values.storage.laneReadWorkers }}
      laneReadWorkers: {{ . }}
      {{- end }}
      {{- with .Values.storage.laneWriteWorkers }}
      laneWriteWorkers: {{ . }}
      {{- end }}
      {{- with .Values.storage.laneReadQueue }}
      laneReadQueue: {{ . }}
      {{- end }}
      {{- with .Values.storage.laneWriteQueue }}
      laneWriteQueue: {{ . }}
      {{- end }}
      {{- if .Values.storage.backpressure.enabled }}
      backpressureEnabled: true
      {{- end }}
      {{- if .Values.storage.backpressure.rejectCritical }}
      backpressureRejectCritical: true
      {{- end }}
      {{- with .Values.storage.backpressure.warningL0Files }}
      backpressureWarningL0Files: {{ . }}
      {{- end }}
      {{- with .Values.storage.backpressure.criticalL0Files }}
      backpressureCriticalL0Files: {{ . }}
      {{- end }}
      {{- with .Values.storage.backpressure.warningDebtBytes }}
      backpressureWarningDebtBytes: {{ . | int64 }}
      {{- end }}
      {{- with .Values.storage.backpressure.criticalDebtBytes }}
      backpressureCriticalDebtBytes: {{ . | int64 }}
      {{- end }}
      {{- with .Values.storage.backpressure.warningReadAmp }}
      backpressureWarningReadAmp: {{ . }}
      {{- end }}
      {{- with .Values.storage.backpressure.criticalReadAmp }}
      backpressureCriticalReadAmp: {{ . }}
      {{- end }}
      {{- with .Values.storage.backpressure.warningDelay }}
      backpressureWarningDelay: {{ . }}
      {{- end }}
      {{- with .Values.storage.backpressure.criticalDelay }}
      backpressureCriticalDelay: {{ . }}
      {{- end }}
      streamRetentionInterval: {{ .Values.storage.streamRetentionInterval | quote }}
      streamRetentionCleanupBatchSize: {{ .Values.storage.streamRetentionCleanupBatchSize }}
    cluster:
      shards: {{ .Values.cluster.shards }}
      replicationFactor: {{ include "cefas.resolvedReplicationFactor" . }}
      muxAddr: ":{{ .Values.service.mux }}"
      bootstrap: {{ .Values.cluster.bootstrap }}
      {{- if .Values.cluster.peers }}
      peers:
        {{- toYaml .Values.cluster.peers | nindent 8 }}
      {{- else if .Values.cluster.generatePeers }}
      {{- $replicas := include "cefas.resolvedReplicaCount" . | int }}
      {{- if gt $replicas 1 }}
      peers:
        {{- range $i := until $replicas }}
        {{ printf "%s-%d" (include "cefas.fullname" $) $i | quote }}: {{ printf "%s:%v" (include "cefas.podDNS" (list $ $i)) $.Values.service.mux | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Values.cluster.httpPeers }}
      httpPeers:
        {{- toYaml .Values.cluster.httpPeers | nindent 8 }}
      {{- else if .Values.cluster.generatePeers }}
      {{- $replicas := include "cefas.resolvedReplicaCount" . | int }}
      {{- if gt $replicas 1 }}
      httpPeers:
        {{- range $i := until $replicas }}
        {{ printf "%s-%d" (include "cefas.fullname" $) $i | quote }}: {{ printf "http://%s:%v" (include "cefas.podDNS" (list $ $i)) $.Values.service.http | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Values.cluster.grpcPeers }}
      grpcPeers:
        {{- toYaml .Values.cluster.grpcPeers | nindent 8 }}
      {{- else if .Values.cluster.generatePeers }}
      {{- $replicas := include "cefas.resolvedReplicaCount" . | int }}
      {{- if gt $replicas 1 }}
      grpcPeers:
        {{- range $i := until $replicas }}
        {{ printf "%s-%d" (include "cefas.fullname" $) $i | quote }}: {{ printf "%s:%v" (include "cefas.podDNS" (list $ $i)) $.Values.service.grpc | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
    raft:
      heartbeatTimeout: {{ .Values.raft.heartbeatTimeout }}
      electionTimeout: {{ .Values.raft.electionTimeout }}
      leaderLeaseTimeout: {{ .Values.raft.leaderLeaseTimeout }}
      commitTimeout: {{ .Values.raft.commitTimeout }}
      applyTimeout: {{ .Values.raft.applyTimeout }}
      snapshotEntries: {{ .Values.raft.snapshotEntries }}
      logCompression: {{ .Values.raft.logCompression | quote }}
      logCompressionMinBytes: {{ .Values.raft.logCompressionMinBytes }}
      logCompressionMinSavingsRatio: {{ .Values.raft.logCompressionMinSavingsRatio }}
      logCompressionSkipCooldown: {{ .Values.raft.logCompressionSkipCooldown }}
    metrics:
      enabled: {{ .Values.metrics.enabled }}
    identity:
      jwksUrl: {{ .Values.identity.jwksUrl | quote }}
      issuer: {{ .Values.identity.issuer | quote }}
      audience: {{ .Values.identity.audience | quote }}
    tracing:
      endpoint: {{ .Values.tracing.endpoint | quote }}
      insecure: {{ .Values.tracing.insecure }}
      sampleRate: {{ .Values.tracing.sampleRate }}
