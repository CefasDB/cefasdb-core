# cefas Helm chart values.
#
# Defaults bring up a single replica StatefulSet on hostPort-style
# Services with persistent storage. Multi-node clusters require
# replicaCount ≥ 3 and the multi-Raft flags below.

image:
  repository: ghcr.io/cefasdb/cefasdb
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

extraArgs: []

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""
  emptyDir:
    sizeLimit: ""

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  http: 8080
  grpc: 9090
  mux: 9100

# Multi-Raft sharding. shards>1 turns on the mux transport.
cluster:
  shards: 1
  replicationFactor: 0
  bootstrap: true
  fsyncOnCommit: false
  generatePeers: true
  peers: {}
  httpPeers: {}
  grpcPeers: {}

storage:
  profile: ""
  raftProfile: ""
  blockCacheSizeBytes: 0
  memTableSizeBytes: 0
  memTableStopWritesThreshold: 0
  maxConcurrentCompactions: 0
  l0CompactionConcurrency: 0
  l0CompactionThreshold: 0
  l0CompactionFileThreshold: 0
  l0StopWritesThreshold: 0
  bytesPerSync: 0
  walBytesPerSync: 0
  lanes: ""
  laneReadWorkers: 0
  laneWriteWorkers: 0
  laneReadQueue: 0
  laneWriteQueue: 0
  backpressure:
    enabled: false
    rejectCritical: false
    warningL0Files: 0
    criticalL0Files: 0
    warningDebtBytes: 0
    criticalDebtBytes: 0
    warningReadAmp: 0
    criticalReadAmp: 0
    warningDelay: ""
    criticalDelay: ""

raft:
  heartbeatTimeout: 2s
  electionTimeout: 10s
  leaderLeaseTimeout: 2s
  commitTimeout: 100ms
  applyTimeout: 30s
  snapshotEntries: 65536
  logCompression: snappy
  logCompressionMinBytes: 1024
  logCompressionMinSavingsRatio: 0.05
  logCompressionSkipCooldown: 1s

# Optional identity provider (Tikti JWKS).
identity:
  jwksUrl: ""
  issuer: ""
  audience: ""

# Optional OTLP/gRPC tracing collector.
tracing:
  endpoint: ""
  insecure: true
  sampleRate: 1.0

# Metrics endpoint always exposed unless explicitly disabled.
metrics:
  enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  prefix: /
  stripPrefix:
    enabled: false
  hosts: []
  tls: []

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}

# Probes target the cheap /v1/Health endpoint.
livenessProbe:
  httpGet:
    path: /v1/Health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /v1/Health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
